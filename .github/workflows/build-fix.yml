name: Build patched AxonHub (usage.cost fix)

# Fork-only workflow. Publishes to GHCR under your own account and never touches
# looplj/axonhub. No repository secrets needed (GITHUB_TOKEN is enough) — but
# Settings -> Actions -> General -> Workflow permissions must be "Read and write".
#
# Run it from the Actions tab, pick the branch, and it tags the image with the
# branch name (or with the `tag` input when you trigger it manually).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        required: false
        default: "costfix"
  push:
    branches:
      - "build/patched-image"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/axonhub:${{ inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
